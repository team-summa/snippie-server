spring:
  application:
    name: snippie-backend

  datasource:
    url: ${{secrets.SPRING_DATASOURCE_URL}}
    username: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
    password: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
    driver-class-name: com.mysql.cj.jdbc.Driver

  redis:
    host: localhost
    port: 6379
    timeout: 5000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

  profiles:
    include: oauth2

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: true
        same-site: lax

openai:
  api-key: ${{ secrets.OPENAI_API_KEY }}
  model: ${{ secrets.OPENAI_API_MODEL }}

app:
  oauth2:
    success-redirect-uri: http://localhost:3000/
