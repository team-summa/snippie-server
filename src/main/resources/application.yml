spring:
  application:
    name: snippie-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: redis
      port: 6379

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

  profiles:
    include: oauth2

server:
  forward-headers-strategy: framework

  servlet:
    session:
      timeout: 2h
      cookie:
        http-only: true
        secure: true
        same-site: none

openai:
  api-key: ${OPENAI_API_KEY}
  model: ${OPENAI_API_MODEL}

app:
  oauth2:
    success-redirect-uri: https://snippie.site/auth/github/callback

logging:
  level:
    root: INFO

    # Spring Web 전체 요청 흐름 확인 (컨트롤러 진입 여부 포함)
    org.springframework.web: DEBUG
    org.springframework.web.servlet.DispatcherServlet: TRACE
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: TRACE

    # 보안 필터에서 막히는 경우 로그 확인
    org.springframework.security: DEBUG

    # Hibernate 쿼리 및 바인딩 값 확인
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.orm.jdbc.extract: TRACE

    # 우리 패키지 (예: com.snippie) 디버깅용
    com.snippie: DEBUG

    # Redis 라이브러리 (불필요한 잡로그 줄이기)
    io.lettuce.core: WARN