spring:
  application:
    name: snippie-backend

  datasource:
    url: jdbc:mysql://localhost:3306/snippie?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username:
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

  profiles:
    include: oauth2

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: true
        same-site: lax

openai:
  api-key:
  model: gpt-3.5-turbo

app:
  oauth2:
    success-redirect-uri: http://localhost:3000/
