name: Snippie CI/CD Pipeline

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. JDK 설치
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 3. Gradle Build
      - name: Build with Gradle (skip tests)
        run: ./gradlew clean build -x test

      # 4. Docker Hub 로그인
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # 5. Docker 이미지 빌드 & 푸시
      - name: Build and Push Docker image
        run: |
          IMAGE_TAG=$(date +%Y%m%d%H%M%S)
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/snippie:$IMAGE_TAG .
          docker tag ${{ secrets.DOCKER_HUB_USERNAME }}/snippie:$IMAGE_TAG ${{ secrets.DOCKER_HUB_USERNAME }}/snippie:latest
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/snippie:$IMAGE_TAG
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/snippie:latest

      # 6. docker-compose.yml 업로드
      - name: Upload docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: ./docker-compose.yml
          target: /home/ubuntu/snippie

      # 7. SSH 접속 및 배포
      - name: SSH to EC2 and deploy
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p /home/ubuntu/snippie

            # .env 파일 생성
            cat <<EOF > /home/ubuntu/snippie/.env
            SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }}
            SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }}
            SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }}
            GITHUB_CLIENT_ID=${{ secrets.GITHUB_CLIENT_ID }}
            GITHUB_CLIENT_SECRET=${{ secrets.GITHUB_CLIENT_SECRET }}
            EOF

            cd /home/ubuntu/snippie

            # 기존 컨테이너 종료 및 제거
            sudo docker-compose down --remove-orphans

            # 최신 이미지 Pull
            sudo docker-compose pull

            # 컨테이너 재시작
            sudo docker-compose up -d
